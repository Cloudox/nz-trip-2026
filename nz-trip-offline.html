<style>
:root {
  --brand: #0d6e7a;
  --brand-2: #14959b;
  --bg: #eef3f6;
  --card: #ffffff;
  --line: #e2eaef;
  --text: #1c2b33;
  --muted: #6b7c87;
  --p0: #e04a3f;
  --p1: #2b7fd4;
  --meal: #e08b2a;
  --drive: #5b7c8d;
  --stay: #2f9e77;
  --flight: #7a5cc4;
  --alert: #d94f70;
  --tip: #8a949c;
  --call: #d98324;
  --shadow: 0 1px 3px rgba(20, 50, 65, .08), 0 4px 14px rgba(20, 50, 65, .05);
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

html, body {
  margin: 0; padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  font-size: 15px;
  line-height: 1.55;
  -webkit-text-size-adjust: 100%;
}

body {
  padding-bottom: calc(62px + env(safe-area-inset-bottom));
}

/* ---------- header ---------- */
.app-header {
  position: sticky; top: 0; z-index: 30;
  background: linear-gradient(135deg, #0b5c68 0%, #12808a 60%, #1aa0a6 100%);
  color: #fff;
  padding: calc(10px + env(safe-area-inset-top)) 16px 12px;
  box-shadow: 0 2px 10px rgba(11, 92, 104, .25);
}
.hd-title { font-size: 19px; font-weight: 700; letter-spacing: .5px; }
.hd-sub { font-size: 12px; opacity: .88; margin-top: 2px; }
.hd-status {
  margin-top: 9px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap;
  font-size: 12.5px;
}
.hd-chip {
  background: rgba(255, 255, 255, .16);
  border: 1px solid rgba(255, 255, 255, .25);
  border-radius: 999px; padding: 3px 11px;
  backdrop-filter: blur(4px);
}
.hd-chip b { font-weight: 700; }
.hd-chip.hot { background: #ffdf7a; color: #6a4a00; border-color: #ffdf7a; font-weight: 700; }

/* ---------- layout ---------- */
.view {
  max-width: 620px; margin: 0 auto;
  padding: 12px 12px 20px;
}

.card {
  background: var(--card);
  border-radius: 14px;
  box-shadow: var(--shadow);
  padding: 13px 14px;
  margin-bottom: 11px;
}

.sec-title {
  font-size: 13px; font-weight: 700; color: var(--brand);
  letter-spacing: .6px; margin: 16px 4px 8px;
  display: flex; align-items: center; gap: 6px;
}
.sec-title:first-child { margin-top: 4px; }

/* ---------- date chips ---------- */
.daystrip {
  display: flex; gap: 7px; overflow-x: auto;
  padding: 4px 2px 10px; margin: 0 -4px;
  scrollbar-width: none;
}
.daystrip::-webkit-scrollbar { display: none; }
.dchip {
  flex: 0 0 auto; min-width: 62px;
  border: 1px solid var(--line); background: #fff;
  border-radius: 12px; padding: 6px 9px;
  text-align: center; cursor: pointer;
  box-shadow: 0 1px 2px rgba(20, 50, 65, .05);
  transition: .15s;
}
.dchip .d1 { font-size: 10.5px; color: var(--muted); }
.dchip .d2 { font-size: 14px; font-weight: 700; line-height: 1.2; }
.dchip .d3 { font-size: 10.5px; color: var(--muted); }
.dchip.on { background: var(--brand); border-color: var(--brand); color: #fff; }
.dchip.on .d1, .dchip.on .d3 { color: rgba(255, 255, 255, .85); }
.dchip.today { border-color: var(--p0); border-width: 2px; }

/* ---------- day head ---------- */
.dayhead {
  display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap;
  margin-bottom: 3px;
}
.dayhead .dh-date { font-size: 17px; font-weight: 800; }
.dayhead .dh-wd { font-size: 12px; color: var(--muted); }
.daytitle { font-size: 14.5px; font-weight: 600; margin: 4px 0 6px; }
.meta-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 7px; }
.meta-pill {
  font-size: 11.5px; background: #f1f6f8; color: var(--brand);
  border-radius: 7px; padding: 2px 8px; border: 1px solid #dde9ed;
}

/* ---------- timeline ---------- */
.tl { position: relative; margin-top: 8px; }
.tl::before {
  content: ""; position: absolute; left: 43px; top: 8px; bottom: 8px;
  width: 2px; background: linear-gradient(180deg, #d8e5ea, #eaf1f4);
}
.item { display: flex; gap: 10px; padding: 7px 0; position: relative; }
.item-time {
  flex: 0 0 38px; text-align: right;
  font-size: 12.5px; font-weight: 700; color: var(--brand);
  padding-top: 1px; font-variant-numeric: tabular-nums;
}
.item-dot {
  flex: 0 0 12px; height: 12px; border-radius: 50%;
  margin-top: 5px; background: #fff; border: 2.5px solid var(--tip);
  z-index: 1;
}
.item.is-p0 .item-dot { border-color: var(--p0); }
.item.is-p1 .item-dot { border-color: var(--p1); }
.item.is-meal .item-dot { border-color: var(--meal); }
.item.is-drive .item-dot { border-color: var(--drive); }
.item.is-stay .item-dot { border-color: var(--stay); }
.item.is-flight .item-dot { border-color: var(--flight); }
.item.is-alert .item-dot { border-color: var(--alert); }
.item.is-call .item-dot { border-color: var(--call); }
.item-body { flex: 1 1 auto; min-width: 0; }

.tag {
  display: inline-block; font-size: 10px; font-weight: 700;
  border-radius: 5px; padding: 1px 6px; margin-right: 5px;
  vertical-align: 1.5px; color: #fff; white-space: nowrap;
}
.tag-p0 { background: var(--p0); }
.tag-p1 { background: var(--p1); }
.tag-meal { background: var(--meal); }
.tag-drive { background: var(--drive); }
.tag-stay { background: var(--stay); }
.tag-flight { background: var(--flight); }
.tag-alert { background: var(--alert); }
.tag-tip { background: var(--tip); }
.tag-call { background: var(--call); }

.item-title { font-size: 14px; font-weight: 600; }

.notes { margin: 5px 0 0; padding-left: 15px; }
.notes li { font-size: 12.8px; color: #48606c; margin: 2px 0; }
.notes li::marker { color: #a9bec7; }

.act-row { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 6px; }
.act {
  font-size: 11.5px; border-radius: 8px; padding: 4px 9px;
  border: 1px solid var(--line); background: #f7fafb; color: var(--brand);
  cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 4px;
}
.act:active { background: #e8f2f4; }
.act.tel { background: #fff5e9; border-color: #f6dfc0; color: #a35a12; }
.act.addr { background: #eef7f8; }

.addr-line { font-size: 12.5px; color: #3f5a66; margin-top: 4px; word-break: break-word; }

/* ---------- quick view ---------- */
.seg { display: flex; gap: 6px; overflow-x: auto; padding: 2px 2px 10px; margin: 0 -2px; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button {
  flex: 0 0 auto; border: 1px solid var(--line); background: #fff;
  border-radius: 999px; padding: 5px 13px; font-size: 12.5px;
  color: var(--muted); cursor: pointer;
}
.seg button.on { background: var(--brand); color: #fff; border-color: var(--brand); font-weight: 600; }

.qrow { padding: 10px 0; border-bottom: 1px dashed var(--line); }
.qrow:last-child { border-bottom: none; padding-bottom: 2px; }
.qname { font-size: 14px; font-weight: 700; }
.qsub { font-size: 12.5px; color: #48606c; margin-top: 2px; word-break: break-word; }
.qnote { font-size: 12px; color: var(--muted); margin-top: 3px; }
.qbadge {
  font-size: 11px; background: #fdf0e3; color: #a35a12;
  border-radius: 6px; padding: 1px 7px; margin-left: 6px; white-space: nowrap;
}

/* ---------- alerts ---------- */
.ten { display: flex; gap: 10px; padding: 10px 0; border-bottom: 1px dashed var(--line); }
.ten:last-child { border-bottom: none; }
.ten-n {
  flex: 0 0 24px; height: 24px; border-radius: 7px;
  background: var(--brand); color: #fff;
  font-size: 12px; font-weight: 700;
  display: flex; align-items: center; justify-content: center;
}
.ten.high .ten-n { background: var(--p0); }
.ten-t { font-size: 14px; font-weight: 700; }
.ten-d { font-size: 12.8px; color: #48606c; margin-top: 2px; }

.conf { margin-bottom: 10px; }
.conf-head {
  display: flex; gap: 8px; align-items: flex-start;
  cursor: pointer;
}
.conf-n {
  flex: 0 0 22px; height: 22px; border-radius: 6px;
  background: #fdf0e3; color: #a35a12; font-size: 11.5px; font-weight: 700;
  display: flex; align-items: center; justify-content: center; margin-top: 1px;
}
.conf-t { font-size: 14px; font-weight: 700; flex: 1; }
.conf-arrow { color: var(--muted); font-size: 12px; transition: .2s; }
.conf.open .conf-arrow { transform: rotate(90deg); }
.conf-body { display: none; margin: 8px 0 0 30px; }
.conf.open .conf-body { display: block; }
.conf-body li { font-size: 12.8px; color: #48606c; margin: 3px 0; }

.warnbox {
  background: #fff8e8; border: 1px solid #f3e0b8; border-radius: 12px;
  padding: 11px 13px; font-size: 12.8px; color: #6d5320; margin-bottom: 11px;
}
.warnbox b { color: #8a5a00; }
.dangerbox {
  background: #fdeeee; border: 1px solid #f6cfcf; border-radius: 12px;
  padding: 11px 13px; font-size: 12.8px; color: #8a3838; margin-bottom: 11px;
}
.dangerbox b { color: #a02c2c; }
.forbid { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 7px; }
.forbid span {
  font-size: 11.5px; background: #fdeeee; color: #a02c2c;
  border: 1px solid #f6cfcf; border-radius: 6px; padding: 2px 7px;
}

/* ---------- checklist ---------- */
.ck-head {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 4px;
}
.ck-prog { font-size: 12px; color: var(--muted); }
.ck-item {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 8px 0; border-bottom: 1px dashed var(--line);
  cursor: pointer;
}
.ck-item:last-child { border-bottom: none; }
.ck-box {
  flex: 0 0 19px; height: 19px; border-radius: 6px;
  border: 2px solid #c3d3da; background: #fff; margin-top: 2px;
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; color: #fff;
}
.ck-item.done .ck-box { background: var(--stay); border-color: var(--stay); }
.ck-item.done .ck-text { text-decoration: line-through; color: var(--muted); }
.ck-text { font-size: 13.2px; flex: 1; }
.ck-reset {
  font-size: 12px; border: 1px solid var(--line); background: #fff;
  color: var(--muted); border-radius: 8px; padding: 4px 10px; cursor: pointer;
}

/* ---------- tabbar ---------- */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: flex;
  background: rgba(255, 255, 255, .96);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom);
}
.tab {
  flex: 1; border: none; background: none; cursor: pointer;
  padding: 7px 0 6px; color: var(--muted);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
  font-size: 11px; font-family: inherit;
}
.tab-ico { font-size: 19px; line-height: 1.1; filter: grayscale(1) opacity(.6); }
.tab.is-active { color: var(--brand); font-weight: 700; }
.tab.is-active .tab-ico { filter: none; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%) translateY(12px);
  background: rgba(28, 43, 51, .94); color: #fff;
  font-size: 12.5px; padding: 7px 15px; border-radius: 999px;
  opacity: 0; pointer-events: none; transition: .22s; z-index: 60;
  max-width: 80%; text-align: center;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

.empty { text-align: center; color: var(--muted); font-size: 13px; padding: 30px 0; }

</style>
</head>
<body>
<header class="app-header">
  <div class="hd-top">
    <div class="hd-title">新西兰南岛 13 天</div>
    <div class="hd-sub">2026.9.24 香港出发 — 10.7 返抵香港</div>
  </div>
  <div class="hd-status" id="hdStatus"></div>
</header>

    let s = String(t || "").replace(/\(0\)/g, "").replace(/[\s()\u2013\u2014-]/g, "");
    if (!s) return null;
    if (s.startsWith("+")) return "tel:" + s;
    if (/^(0800|0508)/.test(s)) return "tel:" + s;
    if (s.startsWith("0")) return "tel:+64" + s.slice(1);
    return "tel:" + s;
  }
  function mapsHref(addr) {
    return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(addr);
  }
  function copyText(t) {
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(t).then(() => toast("已复制：" + t.slice(0, 22))).catch(() => fallback());
    } else fallback();
    function fallback() {
      const ta = document.createElement("textarea");
      ta.value = t; ta.style.position = "fixed"; ta.style.left = "-9999px";
      document.body.appendChild(ta); ta.select();
      try { document.execCommand("copy"); toast("已复制"); } catch (e) { toast("复制失败，请长按选择"); }
      document.body.removeChild(ta);
    }
  }
  function todayIso() {
    const d = new Date();
    return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
  }
  function daysBetween(a, b) {
    return Math.round((new Date(b + "T00:00:00") - new Date(a + "T00:00:00")) / 86400000);
  }

  /* ---------- 当前日期定位 ---------- */
  function resolveToday() {
    const t = todayIso();
    let idx = TRIP.days.findIndex(d => d.iso === t);
    if (idx >= 0) return idx;
    const future = TRIP.days.findIndex(d => d.iso > t);
    if (future >= 0) return future;
    return TRIP.days.length - 1;
  }
  function initDay() {
    const t = todayIso();
    const savedDate = LS.get("nz_daydate", "");
    const savedIdx = LS.get("nz_dayidx", -1);
    state.dayIdx = (savedDate === t && savedIdx >= 0 && savedIdx < TRIP.days.length) ? savedIdx : resolveToday();
    LS.set("nz_daydate", t);
    LS.set("nz_dayidx", state.dayIdx);
  }

  /* ---------- header ---------- */
  function renderStatus() {
    const t = todayIso();
    const dep = TRIP.meta.depIso;
    const last = TRIP.days[TRIP.days.length - 1].iso;
    let html = "";
    if (t < dep) {
      const n = daysBetween(t, dep);
      html += `<span class="hd-chip hot">距出发还有 <b>${n}</b> 天</span>`;
      html += `<span class="hd-chip">${esc(TRIP.meta.crew)}</span>`;
    } else if (t > last) {
      html += `<span class="hd-chip">行程已结束 · 共 13 天</span>`;
    } else {
      const d = TRIP.days[state.dayIdx];
      const inTrip = d.iso === t;
      html += `<span class="hd-chip${inTrip ? " hot" : ""}">${t === d.iso ? "今天" : "当前查看"} · <b>${esc(d.date)}</b> ${esc(d.weekday)}</span>`;
      html += `<span class="hd-chip">Day ${d.id} / 14</span>`;
      if (d.stay && d.stay !== "机上" && d.stay !== "返程") html += `<span class="hd-chip">宿 ${esc(d.stay)}</span>`;
    }
    $status.innerHTML = html;
  }

  /* ---------- 视图：行程 ---------- */
  function itemHtml(it) {
    const tag = it.tag || "tip";
    let h = `<div class="item is-${tag}">
      <div class="item-time">${esc(it.time)}</div>
      <div class="item-dot"></div>
      <div class="item-body">
        <div><span class="tag tag-${tag}">${esc(TAG_TEXT[tag] || "提示")}</span><span class="item-title">${esc(it.title)}</span></div>`;
    if (it.addr) {
      h += `<div class="addr-line">📍 ${esc(it.addr)}</div>`;
    }
    if (it.notes && it.notes.length) {
      h += `<ul class="notes">${it.notes.map(n => `<li>${esc(n)}</li>`).join("")}</ul>`;
    }
    h += `<div class="act-row">`;
    if (it.addr) h += `<a class="act addr" target="_blank" rel="noopener" href="${esc(mapsHref(it.addr))}">地图导航</a>`;
    if (it.addr) h += `<button class="act" data-copy="${esc(it.addr)}">复制地址</button>`;
    if (it.tel) h += `<a class="act tel" href="${esc(telHref(it.tel))}">📞 ${esc(it.tel)}</a>`;
    h += `</div></div></div>`;
    return h;
  }

  function viewDays() {
    const d = TRIP.days[state.dayIdx];
    const chips = TRIP.days.map((x, i) => {
      const isToday = x.iso === todayIso();
      return `<div class="dchip${i === state.dayIdx ? " on" : ""}${isToday ? " today" : ""}" data-day="${i}">
        <div class="d1">Day ${x.id}</div><div class="d2">${esc(x.date)}</div><div class="d3">${esc(x.weekday.split(" · ")[0])}</div>
      </div>`;
    }).join("");

    return `
      <div class="sec-title" style="justify-content:space-between">
        <span>逐日行程</span>
        <button class="ck-reset" data-act="today">回到今天</button>
      </div>
      <div class="daystrip">${chips}</div>
      <div class="card">
        <div class="dayhead">
          <div class="dh-date">${esc(d.date)} ${esc(d.weekday)}</div>
          <div class="dh-wd">Day ${d.id}</div>
        </div>
        <div class="daytitle">${esc(d.title)}</div>
        <div class="meta-row">
          <span class="meta-pill">住宿：${esc(d.stay)}</span>
          <span class="meta-pill">${d.items.length} 个节点</span>
        </div>
        <div class="tl">${d.items.map(itemHtml).join("")}</div>
      </div>`;
  }

  /* ---------- 视图：速查 ---------- */
  const SEGS = [["flight", "✈ 航班"], ["tel", "电话 / 地址"], ["stay", "住宿"], ["meal", "餐食"], ["drive", "自驾租车"]];

  function segHtml() {
    return `<div class="seg">${SEGS.map(([k, label]) =>
      `<button data-seg="${k}" class="${state.seg === k ? "on" : ""}">${label}</button>`).join("")}</div>`;
  }

  function segTel() {
    return `<div class="sec-title">关键电话与地址速查</div>
      <div class="card">${TRIP.contacts.map(c => {
        let h = `<div class="qrow"><div class="qname">${esc(c.name)}<span class="qbadge">报道 ${esc(c.report)}</span></div>`;
        h += `<div class="qsub">📍 ${esc(c.addr)}</div>`;
        if (c.note) h += `<div class="qnote">${esc(c.note)}</div>`;
        h += `<div class="act-row">
          <a class="act tel" href="${esc(telHref(c.tel))}">📞 ${esc(c.tel)}</a>
          <a class="act addr" target="_blank" rel="noopener" href="${esc(mapsHref(c.addr))}">地图</a>
          <button class="act" data-copy="${esc(c.addr)}">复制地址</button>
        </div></div>`;
        return h;
      }).join("")}</div>`;
  }

  function segStay() {
    return `<div class="sec-title">住宿锚点</div>
      <div class="warnbox"><b>免费取消倒计时：</b>${esc(TRIP.cancelNote)}</div>
      <div class="card">${TRIP.stays.map(s => {
        let h = `<div class="qrow"><div class="qname">${esc(s.city)} <span class="qbadge">${esc(s.dates)}</span></div>`;
        h += `<div class="qsub">📍 ${esc(s.addr)}</div>`;
        h += `<div class="qnote">免费取消截止：${esc(s.cancel)}</div>`;
        if (s.notes && s.notes.length) h += `<div class="qnote">${s.notes.map(esc).join(" · ")}</div>`;
        h += `<div class="act-row">
          <a class="act addr" target="_blank" rel="noopener" href="${esc(mapsHref(s.addr))}">地图</a>
          <button class="act" data-copy="${esc(s.addr)}">复制地址</button>`;
        if (s.tel) h += `<a class="act tel" href="${esc(telHref(s.tel))}">📞 ${esc(s.tel)}</a>`;
        h += `</div></div>`;
        return h;
      }).join("")}</div>`;
  }

  function segMeal() {
    return `<div class="sec-title">餐食速查（B 列汇总）</div>
      <div class="card">${TRIP.meals.map(m => `
        <div class="qrow">
          <div class="qname">${esc(m.date)}</div>
          <div class="qsub">${esc(m.plan)}</div>
          <div class="qnote">要点：${esc(m.point)}</div>
        </div>`).join("")}</div>`;
  }

  function segDrive() {
    const dv = TRIP.driving;
    return `<div class="sec-title">自驾与租车</div>
      <div class="card">${dv.rows.map(r => `
        <div class="qrow"><div class="qname">${esc(r.k)}</div><div class="qsub">${esc(r.v)}</div></div>`).join("")}</div>
      <div class="sec-title">禁行路段（保险不赔）</div>
      <div class="card">
        <div class="dangerbox"><b>合同禁止通行：</b>开进去不违法，但出事故车损险与第三者险全部失效。</div>
        <div class="forbid">${dv.forbidden.map(f => `<span>${esc(f)}</span>`).join("")}</div>
        <div class="qnote" style="margin-top:9px">${esc(dv.forbiddenNote)}</div>
      </div>`;
  }

  function segFlight() {
    const F = TRIP.flightInfo;
    const block = (sec) => `
      <div class="card">
        <div class="qname" style="color:var(--brand)">${esc(sec.title)}</div>
        ${sec.segments.map(s => `
          <div class="qrow">
            <div class="qname">${esc(s.seg)} <span class="qbadge">${esc(s.flight)}</span></div>
            <div class="qsub">🛫 出发　${esc(s.dep)}<br>　　　　${esc(s.depAirport)}</div>
            <div class="qsub">🛬 到达　${esc(s.arr)}<br>　　　　${esc(s.arrAirport)}</div>
            <div class="qnote">航司：${esc(s.airline)}</div>
          </div>`).join("")}
        <div class="qrow">
          <div class="qsub">⏱ 中转：${esc(sec.transfer)}</div>
          <div class="qnote" style="color:${sec.bagOk ? "#2f9e77" : "#a02c2c"};font-weight:700;margin-top:4px">${esc(sec.baggage)}</div>
        </div>
      </div>`;
    return `<div class="sec-title">航班信息（确认函版）</div>
      ${block(F.outbound)}
      ${block(F.return)}
      <div class="sec-title">墨尔本中转操作要点（去程，行李不直挂）</div>
      <div class="card"><ul class="notes" style="margin-top:0">${F.transferTips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>`;
  }

  function viewQuick() {
    const body = { flight: segFlight, tel: segTel, stay: segStay, meal: segMeal, drive: segDrive }[state.seg]();
    return segHtml() + body;
  }

  /* ---------- 视图：提醒 ---------- */
  function viewAlert() {
    const ten = TRIP.topTen.map(t => `
      <div class="ten ${t.level}">
        <div class="ten-n">${t.n}</div>
        <div><div class="ten-t">${esc(t.title)}</div><div class="ten-d">${esc(t.detail)}</div></div>
      </div>`).join("");

    const conf = TRIP.conflicts.map(c => `
      <div class="card conf" data-conf="${c.n}">
        <div class="conf-head">
          <div class="conf-n">${c.n}</div>
          <div class="conf-t">${esc(c.title)}</div>
          <div class="conf-arrow">›</div>
        </div>
        <ul class="conf-body">${c.points.map(p => `<li>${esc(p)}</li>`).join("")}</ul>
      </div>`).join("");

    return `
      <div class="sec-title">出发前必看 · 十条</div>
      <div class="card">${ten}</div>
      <div class="sec-title">夏令时</div>
      <div class="warnbox">${esc(TRIP.meta.dstNote)}</div>
      <div class="sec-title">七个冲突与修正（点开看细节）</div>
      ${conf}
      <div class="sec-title">机票</div>
      <div class="card">${TRIP.flights.map(f => `
        <div class="qrow"><div class="qname">${esc(f.dir)} · ${esc(f.date)}</div>
        <div class="qsub">${esc(f.text)}</div><div class="qnote">${esc(f.note)}</div></div>`).join("")}</div>`;
  }

  /* ---------- 视图：清单 ---------- */
  function viewCheck() {
    let total = 0, doneN = 0;
    TRIP.checklist.forEach((g, gi) => g.items.forEach((it, ii) => {
      total++; if (state.done.indexOf(gi + ":" + ii) >= 0) doneN++;
    }));
    const pct = total ? Math.round(doneN / total * 100) : 0;

    const groups = TRIP.checklist.map((g, gi) => {
      const rows = g.items.map((it, ii) => {
        const key = gi + ":" + ii;
        const on = state.done.indexOf(key) >= 0;
        return `<div class="ck-item${on ? " done" : ""}" data-key="${key}">
          <div class="ck-box">${on ? "✓" : ""}</div><div class="ck-text">${esc(it)}</div></div>`;
      }).join("");
      return `<div class="sec-title">${esc(g.group)}</div><div class="card">${rows}</div>`;
    }).join("");

    return `
      <div class="sec-title">出发前 24 小时清单</div>
      <div class="card">
        <div class="ck-head">
          <div class="ck-prog">已完成 <b>${doneN}</b> / ${total} · ${pct}%</div>
          <button class="ck-reset" data-act="reset">清空勾选</button>
        </div>
        <div style="height:6px;background:#eaf1f4;border-radius:99px;margin-top:6px;overflow:hidden">
          <div style="height:100%;width:${pct}%;background:linear-gradient(90deg,#2f9e77,#14959b);border-radius:99px;transition:.3s"></div>
        </div>
        <div class="qnote" style="margin-top:7px">勾选状态保存在本机浏览器，换设备不同步。</div>
      </div>
      ${groups}`;
  }

  /* ---------- render ---------- */
  function render() {
    const map = { days: viewDays, quick: viewQuick, alert: viewAlert, check: viewCheck };
    $view.innerHTML = map[state.view]();
    $view.scrollTop = 0;
    renderStatus();
    document.querySelectorAll(".tab").forEach(b =>
      b.classList.toggle("is-active", b.dataset.view === state.view));
  }

  /* ---------- events ---------- */
  function viewFromHash() {
    const h = (location.hash || "").replace("#", "");
    const parts = h.split("-");
    let v = parts[0] || "";
    if (["days", "quick", "alert", "check"].indexOf(v) < 0) v = "days";
    if (v === "quick" && parts[1] && SEGS.some(s => s[0] === parts[1])) state.seg = parts[1];
    return v;
  }
  window.addEventListener("hashchange", () => {
    state.view = viewFromHash();
    window.scrollTo(0, 0);
    render();
  });

  document.querySelectorAll(".tab").forEach(btn => {
    btn.addEventListener("click", () => {
      state.view = btn.dataset.view;
      window.scrollTo(0, 0);
      render();
      if (location.hash !== "#" + state.view) location.hash = state.view;
    });
  });

  $view.addEventListener("click", e => {
    const chip = e.target.closest(".dchip");
    if (chip) {
      state.dayIdx = +chip.dataset.day;
      LS.set("nz_dayidx", state.dayIdx);
      render();
      document.querySelector(".daystrip .dchip.on") &&
        document.querySelector(".daystrip .dchip.on").scrollIntoView({ inline: "center", block: "nearest" });
      return;
    }
    const seg = e.target.closest("[data-seg]");
    if (seg) { state.seg = seg.dataset.seg; render(); return; }

    const copy = e.target.closest("[data-copy]");
    if (copy) { copyText(copy.dataset.copy); return; }

    const conf = e.target.closest(".conf");
    if (conf) { conf.classList.toggle("open"); return; }

    const ck = e.target.closest(".ck-item");
    if (ck) {
      const key = ck.dataset.key;
      const i = state.done.indexOf(key);
      if (i >= 0) state.done.splice(i, 1); else state.done.push(key);
      LS.set("nz_done", state.done);
      render();
      return;
    }

    const act = e.target.closest("[data-act]");
    if (act) {
      if (act.dataset.act === "today") {
        state.dayIdx = resolveToday();
        LS.set("nz_dayidx", state.dayIdx);
        render();
        setTimeout(() => {
          const on = document.querySelector(".daystrip .dchip.on");
          if (on) on.scrollIntoView({ inline: "center", block: "nearest" });
        }, 30);
      }
      if (act.dataset.act === "reset") {
        state.done = []; LS.set("nz_done", []); render(); toast("已清空勾选");
      }
    }
  });

  /* ---------- 离线：注册 Service Worker ---------- */
  if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }

  /* ---------- init ---------- */
  state.view = viewFromHash();
  initDay();
  render();
})();

</script>
</body>
</html>
